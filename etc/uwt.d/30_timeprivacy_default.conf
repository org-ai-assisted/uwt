## Please use "/etc/uwt.d/50_timeprivacy_user.conf" for your custom
## configuration, which will override the defaults found here.
## When Whonix is updated, this file may be overwritten.

## Enable or disable Time Privacy for all supported applications.
##   "0"  -> disable Time Privacy for ALL applications; the per-app entries
##           below are ignored (the global disable wins, nothing can re-enable
##           per app). This is the default.
##   "1"  -> enable Time Privacy; a per-app entry of "0" disables that ONE
##           application. Any value other than "0" means enabled.
## Same contract as uwtwrapper_global in 30_uwt_default.conf; only the default
## differs (Time Privacy is off by default, uwt is on by default).
timeprivacy_global="0"

## The global setting above is authoritative. A per-app entry only takes effect
## while Time Privacy is enabled globally (timeprivacy_global != "0"), and then
## only to DISABLE ("0") that one application; a per-app "1" is redundant with
## the global default. To use Time Privacy for a single application, enable it
## globally and disable the others.
## Comment them in/out and set to 0 (disable) as needed.
#timeprivacy["/usr/bin/git"]="0"
#timeprivacy["/usr/bin/apt"]="0"
#timeprivacy["/usr/bin/apt-file"]="0"
#timeprivacy["/usr/bin/apt-get"]="0"
#timeprivacy["/usr/bin/curl"]="0"
#timeprivacy["/usr/bin/gpg"]="0"
#timeprivacy["/usr/bin/gpg2"]="0"
#timeprivacy["/usr/bin/mixmaster-update"]="0"
#timeprivacy["/usr/bin/rawdog"]="0"
#timeprivacy["/usr/bin/ssh"]="0"
#timeprivacy["/usr/bin/wget"]="0"
#timeprivacy["/usr/bin/wormhole"]="0"

## Technical Comment:
## - This file gets sourced by uwt wrappers.
## - "-" in variable names is forbidden by bash. Therefore we use
##   only variable names without "-". For reading the correct variable
##   names without "-", the "-" will get temporarily removed from the
##   variable name of the file.
