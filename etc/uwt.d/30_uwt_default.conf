## Enable or disable all uwt stream isolation wrappers globally.
##   "0"  -> disable uwt for ALL applications; the per-app entries below are
##           ignored (the global disable wins, nothing can re-enable per app).
##   "1"  -> enable uwt; a per-app entry of "0" disables that ONE application.
## Any value other than "0" means enabled.
uwtwrapper_global="1"

## The global setting above is authoritative. A per-app entry only takes effect
## while uwt is enabled globally, and then only to DISABLE ("0") that one
## application; a per-app "1" is redundant with the global default.
## Comment them in/out and set to 0 (disable) as needed.
#uwtwrapper["/usr/bin/git"]="0"
#uwtwrapper["/usr/bin/apt"]="0"
#uwtwrapper["/usr/bin/apt-file"]="0"
#uwtwrapper["/usr/bin/apt-get"]="0"
#uwtwrapper["/usr/bin/curl"]="0"
#uwtwrapper["/usr/bin/gpg"]="0"
#uwtwrapper["/usr/bin/gpg2"]="0"
#uwtwrapper["/usr/bin/mixmaster-update"]="0"
#uwtwrapper["/usr/bin/rawdog"]="0"
#uwtwrapper["/usr/bin/ssh"]="0"
#uwtwrapper["/usr/bin/wget"]="0"
#uwtwrapper["/usr/bin/yum"]="0"
#uwtwrapper["/usr/bin/yumdownloader"]="0"
#uwtwrapper["/usr/bin/wormhole"]="0"

